<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Überfix</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#F3F4F5;--card:#fff;--ink:#12181F;--mute:#5E6A75;--line:#D5D9DD;--blue:#0B3D91;--red:#C8281E;--ok:#1B7A43}
@media (prefers-color-scheme:dark){:root{--bg:#10151A;--card:#192028;--ink:#EDF0F2;--mute:#9AA6B1;--line:#2C3640;--blue:#6C9BF0;--red:#F0665C;--ok:#4CC27C}}
*{box-sizing:border-box}
body{margin:0;background:#0b2a55;color:var(--ink);font:400 16px/1.45 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url(hintergrund.jpg) center/cover;filter:blur(26px) brightness(.8);transform:scale(1.15)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:url(hintergrund.jpg) center top 44px/contain no-repeat}
@media (min-aspect-ratio:1/1){body::after{background-position:center}}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
main.in{margin:48px auto 24px;border-radius:14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px)}
main.auth{max-width:none;padding:0}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header h1{font-size:24px;margin:0;flex:1}
h2{font-size:20px;margin:0 0 10px}h3{font-size:18px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 3px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px}
button{font:inherit;font-weight:600;border-radius:8px;padding:10px 14px;cursor:pointer;border:1px solid var(--ink)}
.pri{background:var(--ink);color:var(--bg);width:100%;margin-top:14px}
.sec{background:none;color:var(--ink)}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;width:100%;margin-top:8px}
.row{display:flex;gap:10px}.row>*{flex:1}
.meta{font-size:14px;color:var(--mute)}
.top{display:flex;justify-content:space-between;gap:10px}
.plate{background:#fff;color:#111;border:2px solid #111;border-radius:6px;padding:2px 10px 2px 16px;font-size:21px;font-weight:700;white-space:nowrap;box-shadow:inset 7px 0 0 #0B3D91;height:fit-content}
.badge{display:inline-block;font-size:14px;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-top:6px}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.red{color:var(--red);border-color:var(--red)}
.bid{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;gap:8px}
.chat{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:8px;padding:10px;margin:10px 0;max-height:240px;overflow-y:auto}
.msg{max-width:80%;padding:7px 11px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--blue);border-color:var(--blue);color:#fff}
.warn{border-color:var(--red)}
.authbox{background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(8px);width:min(300px,calc(100vw - 24px));padding:12px;margin:12px}
.authbox h2{font-size:17px;margin:0 0 2px}.authbox label{font-size:13px;margin:7px 0 2px}.authbox input,.authbox select{padding:8px}
.authbox .pri{margin-top:10px;padding:9px}.authbox .link{margin-top:4px;padding:4px;font-size:14px}
@media (max-aspect-ratio:1/1){main.auth .authbox{margin:calc(100vw*1.0667 + 36px) auto 24px}}
@media (min-aspect-ratio:1/1){main.auth{position:fixed;left:0;bottom:0;max-height:100vh;overflow:auto}}
.burger{position:fixed;top:max(6px,env(safe-area-inset-top));left:6px;z-index:30;width:38px;height:38px;padding:0;border-radius:10px;background:rgba(10,30,60,.6);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);font-size:20px}
#side{position:fixed;top:0;left:0;bottom:0;width:250px;z-index:35;background:var(--card);border-right:1px solid var(--line);padding:12px;transform:translateX(-102%);transition:transform .2s;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
#side.open{transform:none}
#side button{text-align:left;background:none;border:0;border-radius:8px;padding:11px 12px;color:var(--ink);font-weight:600}
#side button:hover{background:var(--bg)}
#pg{position:fixed;inset:0;z-index:40;background:rgba(5,15,30,.65);overflow:auto;padding:16px}
#pg[hidden]{display:none}
.pgbox{max-width:640px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:12px;padding:16px}
.doc h3{margin:16px 0 4px}.doc p,.doc li{margin:4px 0}.doc ul{padding-left:20px}
.doc details{border-top:1px solid var(--line);padding:10px 0}.doc summary{font-weight:600;cursor:pointer}
.ph{background:rgba(200,40,30,.16);padding:0 4px;border-radius:4px}
.wallet{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wallet b{font-size:22px}
</style>
</head>
<body>
<button class="burger" data-m="toggle" aria-label="Menü öffnen oder schließen">☰</button>
<nav id="side" aria-label="Menü">
<button data-m="toggle">✕ Schließen</button>
<button data-m="ueber">Über uns</button>
<button data-m="support">Support</button>
<button data-m="kontakt">Kontakt</button>
<button data-m="agb">AGB</button>
<button data-m="impressum">Impressum</button>
<button data-m="datenschutz">Datenschutz</button>
</nav>
<div id="pg" hidden><div class="pgbox"><button class="sec" data-m="close">Schließen</button><div id="pgc" class="doc"></div></div></div>
<main id="app"></main>
<script>
const SB_URL='https://gawhklcmsrulzdhmiglb.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdhd2hrbGNtc3J1bHpkaG1pZ2xiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTE5NzQsImV4cCI6MjEwNjk2Nzk3NH0.6jEicxjrfT_fV7xs_-0y7hYs_LtJfqZaeph0uR5KULo';
const sb=supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById('app'),$=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=c=>(c/100).toLocaleString('de-DE')+' €';
const day=s=>s.split('-').reverse().join('.');
let user=null,me=null,mode='login',chatOpen=null,msgs=[],chan=null,unread={},totalUnread=0;

const ICON='<svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0B3D91"/><path d="M30 38V58a20 20 0 0 0 40 0V38" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="22" r="6.5" fill="#C8281E"/><circle cx="70" cy="22" r="6.5" fill="#C8281E"/></svg>';
const head=()=>`<header>${ICON}<h1>Überfix</h1>${totalUnread?`<span class="badge red" style="margin:0 8px 0 0">${totalUnread} neu</span>`:''}${user?'<button class="sec" data-a="out">Abmelden</button>':''}</header>`;
const jobHead=j=>`<div class="top"><div><h3>${esc(j.car)}</h3><div class="meta">${esc(j.from_city)} nach ${esc(j.to_city)} · ${day(j.pickup_date)}</div></div><div class="plate">${eur(j.price_cents)}</div></div>`;

function chatBox(j){
  const b=`<button class="sec" style="margin-top:10px" data-a="chat" data-id="${j.id}">${chatOpen===j.id?'Chat schließen':'Chat öffnen'}${unread[j.id]?` <span class="badge red" style="margin:0 0 0 6px">${unread[j.id]} neu</span>`:''}</button>`;
  if(chatOpen!==j.id)return b;
  return b+`<div class="chat">${msgs.length?msgs.map(m=>`<div class="msg ${m.sender_id===user.id?'me':''}">${esc(m.body)}</div>`).join(''):'<div class="meta">Noch keine Nachrichten.</div>'}</div>
  <div class="row"><input id="m${j.id}" placeholder="Nachricht schreiben" aria-label="Nachricht"><button class="sec" style="flex:0 0 auto" data-a="send" data-id="${j.id}">Senden</button></div>`;
}

function authView(){
  if(mode==='forgot')return forgotView();
  app.innerHTML=`<div class="card authbox"><h2>${mode==='login'?'Anmelden':'Registrieren'}</h2>
  ${mode==='signup'?'<label for="role">Ich bin</label><select id="role"><option value="dealer">Händler</option><option value="driver">Überführer</option></select><label for="name">Name</label><input id="name">':''}
  <label for="em">E-Mail</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Passwort</label><input id="pw" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}">
  <button class="pri" data-a="auth">${mode==='login'?'Anmelden':'Konto erstellen'}</button>
  ${mode==='login'?'<button class="link" data-a="forgot">Passwort vergessen?</button>':''}
  <button class="link" data-a="swap">${mode==='login'?'Neu hier? Registrieren':'Schon ein Konto? Anmelden'}</button></div>`;
}

function forgotView(){
  app.innerHTML=`<div class="card authbox"><h2>Passwort zurücksetzen</h2>
  <p class="meta">Gib deine E-Mail-Adresse ein. Wir schicken dir einen Link, mit dem du ein neues Passwort festlegst.</p>
  <label for="em">E-Mail</label><input id="em" type="email" autocomplete="email">
  <button class="pri" data-a="sendreset">Link senden</button>
  <button class="link" data-a="back">Zurück zur Anmeldung</button></div>`;
}
function newPwView(){
  app.innerHTML=`<div class="card authbox"><h2>Neues Passwort festlegen</h2>
  <label for="pw1">Neues Passwort (mindestens 6 Zeichen)</label><input id="pw1" type="password" autocomplete="new-password">
  <label for="pw2">Passwort wiederholen</label><input id="pw2" type="password" autocomplete="new-password">
  <button class="pri" data-a="savepw">Passwort speichern</button></div>`;
}

async function dealerView(){
  const [{data:jobs},{data:sub},{data:wal}]=await Promise.all([
    sb.from('jobs').select('*,bids(id,price_cents,profiles(name))').order('created_at',{ascending:false}),
    sb.from('dealer_subscriptions').select('status').eq('dealer_id',user.id).maybeSingle(),
    sb.from('dealer_wallets').select('balance_cents').eq('dealer_id',user.id).maybeSingle()]);
  const balance=wal?wal.balance_cents:0;
  const active=sub&&sub.status==='active';
  app.innerHTML=head()+`<p class="meta">Angemeldet als ${esc(me.name)} (Händler)</p>`+
  (active?'':'<div class="card warn"><b>Kein aktives Abo</b><div class="meta">Ohne aktives Abo kannst du keine Aufträge einstellen.</div></div>')+
  `<div class="card"><div class="wallet"><div><div class="meta">Dein Guthaben</div><b>${eur(balance)}</b></div></div>
  <div class="row" style="margin-top:10px"><input id="topamt" type="number" min="1" max="1000" inputmode="numeric" placeholder="Betrag in €" aria-label="Aufladebetrag in Euro"><button class="sec" data-a="topup">Aufladen</button></div>
  <div class="meta" style="margin-top:6px">Testmodus: Die Aufladung ist simuliert. Mit dem Zahlungsanbieter kommen PayPal, Karte, SEPA und Klarna. Bei Annahme eines Angebots wird der Betrag reserviert.</div></div>
  <div class="card"><h2>Neuen Auftrag einstellen</h2>
  <label for="car">Fahrzeug</label><input id="car" placeholder="z. B. Mercedes C 220 d">
  <div class="row"><div><label for="from">Abholort</label><input id="from"></div><div><label for="to">Zielort</label><input id="to"></div></div>
  <div class="row"><div><label for="date">Datum</label><input id="date" type="date"></div><div><label for="price">Dein Preis (€)</label><input id="price" type="number" min="1" inputmode="numeric"></div></div>
  <button class="pri" data-a="post">Auftrag veröffentlichen</button></div><h2>Deine Aufträge</h2>`+
  ((jobs||[]).length?jobs.map(j=>{const isOpen=j.status==='open',fin=j.status==='completed';
    return `<div class="card">${jobHead(j)}<span class="badge ${isOpen?'':'ok'}">${isOpen?'Offen · '+j.bids.length+' Angebote':fin?'Erledigt · Auszahlung freigegeben':'Vergeben für '+eur(j.agreed_price_cents)+' · Geld reserviert'}</span>`+
    (isOpen?j.bids.map(b=>`<div class="bid"><div><b>${esc(b.profiles?.name)}</b><div class="meta">bietet ${eur(b.price_cents)}</div></div><button class="sec" data-a="acc" data-id="${b.id}">Annehmen</button></div>`).join(''):
      (fin?'':`<button class="pri" data-a="done" data-id="${j.id}">Auftrag erledigt</button><div class="meta" style="margin-top:4px">Damit gibst du das reservierte Geld zur Auszahlung an den Überführer frei.</div>`)+chatBox(j))+'</div>'}).join(''):'<div class="meta">Noch keine Aufträge.</div>');
}

async function driverView(){
  const [{data:ver},{data:open},{data:mine},{data:bids}]=await Promise.all([
    sb.from('driver_verifications').select('status').eq('driver_id',user.id).maybeSingle(),
    sb.from('jobs').select('*').eq('status','open').order('pickup_date'),
    sb.from('jobs').select('*').eq('assigned_driver_id',user.id),
    sb.from('bids').select('job_id').eq('driver_id',user.id)]);
  const ok=ver&&ver.status==='approved',sent=new Set((bids||[]).map(b=>b.job_id));
  const label={none:'noch nicht eingereicht',pending:'in Prüfung',rejected:'abgelehnt'}[ver?.status];
  app.innerHTML=head()+`<p class="meta">Angemeldet als ${esc(me.name)} (Überführer)</p>`+
  (ok?'<span class="badge ok">Verifiziert</span>':`<div class="card warn"><b>Noch nicht freigeschaltet</b><div class="meta">Status: ${label||'unbekannt'}. Offene Aufträge siehst du erst nach der Freischaltung.</div></div>`)+
  ((mine||[]).length?'<h2 style="margin-top:14px">Meine Aufträge</h2>'+mine.map(j=>`<div class="card">${jobHead(j)}<span class="badge ok">${j.status==='completed'?'Erledigt · Auszahlung von '+eur(Math.round(j.agreed_price_cents*0.9))+' wird veranlasst':'Zugesagt für '+eur(j.agreed_price_cents)}</span>${chatBox(j)}</div>`).join(''):'')+
  '<h2 style="margin-top:14px">Offene Aufträge</h2>'+
  ((open||[]).length?open.map(j=>`<div class="card">${jobHead(j)}<div class="meta" style="margin:6px 0">Auszahlung für dich: ${eur(Math.round(j.price_cents*0.9))} nach 10 % Servicegebühr</div>`+
    (sent.has(j.id)?'<span class="badge red">Dein Angebot liegt vor</span>':`<div class="row"><button class="pri" style="margin-top:4px" data-a="bid" data-id="${j.id}" data-p="${j.price_cents}">Für ${eur(j.price_cents)} anbieten</button></div>
    <div class="row" style="margin-top:10px"><input id="cp${j.id}" type="number" min="1" inputmode="numeric" placeholder="Gegenangebot in €" aria-label="Gegenangebot in Euro"><button class="sec" data-a="cbid" data-id="${j.id}">Senden</button></div>`)+'</div>').join(''):'<div class="meta">Aktuell keine offenen Aufträge.</div>');
}

let recovery=false;
async function show(){
  const ae=document.activeElement,keep=ae&&/^m\d+$/.test(ae.id||'')?ae.id:null,val=keep?ae.value:'';
  await showInner();
  if(keep){const n=$(keep);if(n){n.value=val;n.focus()}}
}
async function showInner(){
  app.className=(user&&!recovery)?'in':'auth';
  if(recovery)return newPwView();
  if(!user)return authView();
  if(!me){app.innerHTML=head()+'<div class="card">Dein Profil wird geladen. Bitte kurz warten.</div>';return}
  if(chatOpen){const {data}=await sb.from('messages').select('*').eq('job_id',chatOpen).order('created_at');msgs=data||[];
    await sb.from('messages').update({read_at:new Date().toISOString()}).eq('job_id',chatOpen).is('read_at',null).neq('sender_id',user.id)}
  const {data:un}=await sb.from('messages').select('job_id').is('read_at',null).neq('sender_id',user.id);
  unread={};(un||[]).forEach(m=>{unread[m.job_id]=(unread[m.job_id]||0)+1});
  totalUnread=(un||[]).length;document.title=(totalUnread?'('+totalUnread+') ':'')+'Überfix';
  await(me.role==='dealer'?dealerView():driverView());
}
async function setUser(u){
  user=u||null;me=null;chatOpen=null;
  if(user){const {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();me=data}
  if(chan){sb.removeChannel(chan);chan=null}
  if(user)chan=sb.channel('msgs').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>show()).subscribe();
  await show();
}
async function toggleChat(id){
  chatOpen=chatOpen===id?null:id;
  await show();
}

app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=+b.dataset.id,fail=(er)=>alert('Fehler: '+er.message);
  if(a==='swap'){mode=mode==='login'?'signup':'login';authView()}
  else if(a==='out'){recovery=false;await sb.auth.signOut()}
  else if(a==='forgot'){mode='forgot';authView()}
  else if(a==='back'){mode='login';authView()}
  else if(a==='sendreset'){
    const email=$('em').value.trim();if(!email)return alert('Bitte E-Mail eingeben.');
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error)return fail(error);
    alert('Wenn es ein Konto mit dieser E-Mail gibt, haben wir dir einen Link geschickt. Prüfe auch den Spam-Ordner.');
    mode='login';authView()}
  else if(a==='savepw'){
    const p1=$('pw1').value,p2=$('pw2').value;
    if(p1.length<6)return alert('Das Passwort braucht mindestens 6 Zeichen.');
    if(p1!==p2)return alert('Die Passwörter sind nicht gleich.');
    const {error}=await sb.auth.updateUser({password:p1});if(error)return fail(error);
    alert('Dein Passwort wurde geändert.');recovery=false;mode='login';show()}
  else if(a==='auth'){
    const email=$('em').value.trim(),password=$('pw').value;
    if(mode==='login'){const {error}=await sb.auth.signInWithPassword({email,password});if(error)alert('Anmeldung fehlgeschlagen: '+error.message)}
    else{const name=$('name').value.trim(),role=$('role').value;if(!name)return alert('Bitte Namen eingeben.');
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{role,name}}});
      if(error)return fail(error);if(!data.session)alert('Bitte bestätige zuerst deine E-Mail und melde dich dann an.')}}
  else if(a==='post'){
    const car=$('car').value.trim(),from_city=$('from').value.trim(),to_city=$('to').value.trim(),pickup_date=$('date').value,price_cents=Math.round(+$('price').value*100);
    if(!car||!from_city||!to_city||!pickup_date||!(price_cents>0))return alert('Bitte alle Felder ausfüllen.');
    const {error}=await sb.from('jobs').insert({dealer_id:user.id,car,from_city,to_city,pickup_date,price_cents});
    if(error)return fail(error);show()}
  else if(a==='acc'){const {error}=await sb.rpc('accept_bid',{p_bid_id:id});if(error)return fail(error);show()}
  else if(a==='bid'){const {error}=await sb.from('bids').insert({job_id:id,driver_id:user.id,price_cents:+b.dataset.p});if(error)return fail(error);show()}
  else if(a==='cbid'){const p=Math.round(+$('cp'+id).value*100);if(!(p>0))return alert('Bitte einen Preis eingeben.');
    const {error}=await sb.from('bids').insert({job_id:id,driver_id:user.id,price_cents:p});if(error)return fail(error);show()}
  else if(a==='topup'){const cents=Math.round(+$('topamt').value*100);
    if(!(cents>=100&&cents<=100000))return alert('Bitte einen Betrag zwischen 1 € und 1.000 € eingeben.');
    const {error}=await sb.rpc('demo_topup',{p_amount_cents:cents});if(error)return fail(error);show()}
  else if(a==='done'){if(!confirm('Auftrag als erledigt melden? Das reservierte Geld wird dann an den Überführer zur Auszahlung freigegeben.'))return;
    const {error}=await sb.rpc('complete_job',{p_job_id:id});if(error)return fail(error);show()}
  else if(a==='chat'){toggleChat(id)}
  else if(a==='send'){const body=$('m'+id).value.trim();if(!body)return;
    const {error}=await sb.from('messages').insert({job_id:id,sender_id:user.id,body});if(error)return fail(error);show()}
});

const PAGES={
ueber:{t:'Über uns',h:`<p><b>Einfach. Direkt. Persönlich.</b></p>
<p>Überfix bringt Autohändler und selbstständige Fahrer zusammen. Der Händler stellt einen Auftrag mit seinem Preis ein, ein geprüfter Überführer nimmt ihn an, das Fahrzeug wird sicher von A nach B gebracht.</p>
<ul><li>Ein Fahrer. Kein Transportunternehmen.</li><li>Keine LKWs und keine Speditionen.</li><li>Der Betrag wird bei Auftragsannahme reserviert und nach der Übergabe ausgezahlt.</li></ul>
<p><b>Dein Weg. Unser Auftrag.</b></p>`},
support:{t:'Support',h:`<p>Wir helfen bei Fragen zu Aufträgen, Guthaben und Verifizierung.</p>
<p>E-Mail: <span class="ph">[support@deine-domain.de]</span><br>Erreichbar: <span class="ph">[Zeiten festlegen]</span></p>
<h3>Häufige Fragen</h3>
<details><summary>Wie lade ich Guthaben auf?</summary><p>Händler laden ihr Konto oben im Händlerbereich auf. Bei Annahme eines Angebots wird der Auftragsbetrag aus dem Guthaben reserviert.</p></details>

<h3>2. Rolle von Überfix</h3><p>Überfix vermittelt zwischen Händlern und Überführern. Der Überführungsvertrag kommt nur zwischen Händler und Überführer zustande.</p>
<h3>3. Registrierung</h3><p>Überführer müssen Ausweis, Führerschein und einen aktuellen Wohnsitznachweis vorlegen. Aufträge sehen sie erst nach der Freischaltung.</p>

<h3>6. Haftung und Versicherung</h3><p>Der Überführer fährt eigenverantwortlich und benötigt ausreichenden Versicherungsschutz <span class="ph">[festlegen]</span>. Die Haftung von Überfix ist beschränkt <span class="ph">[anwaltlich prüfen]</span>.</p>

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-m]');if(!b)return;
  const m=b.dataset.m,side=$('side');
  if(m==='toggle'){side.classList.toggle('open');return}
  if(m==='close'){$('pg').hidden=true;return}
  side.classList.remove('open');
  const P=PAGES[m];if(!P)return;
  $('pgc').innerHTML='<h2>'+P.t+'</h2>'+P.h;$('pg').hidden=false;$('pg').scrollTop=0;
});

sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='PASSWORD_RECOVERY'){recovery=true;setUser(s?.user);return}
  if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT'){if((s?.user?.id||null)!==(user?.id||null)||ev==='INITIAL_SESSION')setUser(s?.user)}});
</script>
